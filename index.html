:root{--bg:#f5f3ff;--card:#fff;--ink:#1e1b3a;--mute:#6b6a85;--line:#e4e0f7;--accent:#6d5ae6;--bad:#e11d48;--a1:#6d5ae6;--a2:#ec4899;--a3:#f59e0b;--a4:#14b8a6;--a5:#3b82f6}

body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:radial-gradient(circle at 0% 0%,rgba(109,90,230,.22),transparent 45%),radial-gradient(circle at 100% 8%,rgba(236,72,153,.18),transparent 40%),var(--bg);background-attachment:fixed}
.card{border-radius:18px;box-shadow:0 10px 28px rgba(90,70,200,.12)}
button{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 12px rgba(109,90,230,.3);transition:transform .15s}
button:active{transform:scale(.96)}
button.ghost,button.del{box-shadow:none}
input,select{border-radius:12px}
input:focus,select:focus{outline:2px solid var(--a1);border-color:transparent}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 16px}

.brand .bn{font-weight:700;font-size:1.3rem;line-height:1.2;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:.85rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--a1)) 16%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--a1)) 40%,transparent)}
.xcard{--c:var(--a1);padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c)}
.xcard.c1{--c:var(--a2)}.xcard.c2{--c:var(--a3)}.xcard.c3{--c:var(--a4)}.xcard.c4{--c:var(--a5)}
.xcard .xt{font-weight:700;font-size:1.05rem}
.xcard button{width:100%;margin-top:6px;background:linear-gradient(135deg,var(--c),var(--a2))}
#exams{display:grid;gap:12px}
#home>.card:first-child{background:linear-gradient(135deg,#6d5ae6,#ec4899 60%,#f59e0b);color:#fff;border:0}

#home>.card:first-child .chip{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45);color:#fff}
#home>.card:first-child button.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(90,70,200,.12);align-items:center;margin-bottom:8px}
#timer{background:linear-gradient(135deg,var(--a4),var(--a5));color:#fff;padding:4px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
#timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.pbar{height:8px;border-radius:99px;background:var(--line);margin:6px 0 12px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a4),var(--a1),var(--a2));transition:width .3s}
.opt{padding:14px;border-radius:14px;border-width:2px;font-size:1.02rem;transition:.15s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 14%,transparent)}
#res{text-align:center}
.score{font-size:1.6rem}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--a4) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:"";grid-area:1/1;width:118px;height:118px;border-radius:50%;background:var(--card)}
.ring b{grid-area:1/1;font-size:1.8rem;z-index:1}

@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.sc{border-radius:16px;padding:12px;color:#fff}
.sc b{display:block;font-size:1.6rem}.sc span{font-size:.85rem}
.s1{background:linear-gradient(135deg,var(--a1),var(--a5))}.s2{background:linear-gradient(135deg,var(--a2),var(--a3))}
.s3{background:linear-gradient(135deg,var(--a4),var(--a5))}.s4{background:linear-gradient(135deg,var(--a3),var(--a2))}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:.85rem;border:1px solid var(--line);cursor:pointer}
.dots b.done{background:linear-gradient(135deg,var(--a4),var(--a5));color:#fff;border-color:transparent}
.dots b.cur{outline:2px solid var(--a2)}
#revbody{display:flex;flex-direction:column}
.prhead{font-weight:700;color:var(--a1);border-bottom:2px solid var(--a1);padding-bottom:6px;margin-bottom:10px}
.sig{display:none;order:99;justify-content:space-between;margin-top:40px}
.hrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hrow .hp{min-width:56px;text-align:center;font-weight:700;border-radius:10px;padding:4px 8px;background:linear-gradient(135deg,var(--a3),var(--a2));color:#fff}
@media print{.sig{display:flex}}
@media print{:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#333;--line:#999;--accent:#000}body{background:#fff}.brand{display:none!important}.card{box-shadow:none}}

.wrap{max-width:640px}body.admin .wrap{max-width:720px}


.tabs{flex-wrap:wrap}
.bdg.off{opacity:.4;filter:grayscale(1)}
.lbrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);border-radius:10px}
.lbrow.me{background:color-mix(in srgb,var(--a1) 14%,transparent)}
.lbrow .rk{min-width:34px;text-align:center;font-weight:700}
.lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.bank-item input{width:auto;margin:6px 0 0}
.ovl{position:fixed;inset:0;background:rgba(15,10,40,.62);z-index:90;display:grid;place-items:center;padding:14px}
.ovl>.card{width:100%;max-width:560px;max-height:92vh;overflow:auto;margin:0}

.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.crumb button{margin:0;padding:6px 12px}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cbox{--c:var(--a1);border-radius:18px;padding:16px 10px;color:#fff;cursor:pointer;text-align:center;background:linear-gradient(135deg,var(--c),var(--a2));box-shadow:0 6px 16px rgba(90,70,200,.18);transition:transform .15s}
.cbox:active{transform:scale(.97)}
.cbox.k1{--c:var(--a5)}.cbox.k2{--c:var(--a4)}.cbox.k3{--c:var(--a3)}.cbox.k4{--c:var(--a2)}
.cbox b{display:block;font-size:2rem;line-height:1.2}
.cbox .cn{font-weight:700}
.cbox small{display:block;opacity:.92;margin-top:2px}
.egrid{display:grid;gap:12px}
.chh{font-weight:700;margin:14px 0 6px;color:var(--a1)}
.citem{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.citem:active{transform:scale(.98)}
.citem .ci{font-size:1.4rem}
.cview{white-space:pre-wrap;line-height:1.8;margin:10px 0}
textarea.ta{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:4px 0 8px}
</style>

<section id="auth" class="card hide">

  <label>ইমেইল</label><input id="email" type="email" autocomplete="email">

  <div class="err" id="aerr"></div>
  <button id="abtn">লগইন</button>
  <button class="ghost" id="aswitch">নতুন অ্যাকাউন্ট খুলুন</button>
  <button class="ghost" id="forgot">পাসওয়ার্ড ভুলে গেছেন?</button>
</section>

<section id="guest" class="card hide">
  <h1 id="gtitle">পরীক্ষা</h1>

  <div class="err" id="gmsg"></div>
  <div id="gform">
    <div id="gnameBox"><label>আপনার নাম</label><input id="gname" autocomplete="name" maxlength="60" placeholder="পূর্ণ নাম লিখুন"></div>
    <div class="err" id="gerr"></div>
    <button id="gbtn">পরীক্ষা শুরু করুন</button>
  </div>
</section>

<section id="reset" class="card hide">

  <div class="err" id="rerr"></div>
  <button id="rbtn">পাসওয়ার্ড বদলান</button>
</section>

<section id="home" class="hide">
  <div class="card">
    <h1 id="hello"></h1>
    <div class="chips" id="stats"></div>
    <button class="ghost" id="logout">লগআউট</button>
    <button class="ghost hide" id="adminbtn">🛠 অ্যাডমিন প্যানেল</button>
  </div>

  <div class="card"><h2 id="navtitle">📚 শ্রেণি, বিষয় ও পরীক্ষা</h2><div id="crumb" class="crumb"></div><div id="exams"></div></div>
  <div class="card"><h2>🏆 আমার আগের ফলাফল</h2><div id="past"></div></div>

<section id="exam" class="hide">

  <div class="pbar"><i id="pfill"></i></div>
  <div class="card">
    <div id="qn" style="color:var(--mute)"></div>

function showReview(d,box){
  box.innerHTML="";
  box.appendChild(el("div","Exam Site by Arghya · উত্তরপত্র","prhead"));
  var sg=el("div",null,"sig");sg.appendChild(el("span","স্টুডেন্টের স্বাক্ষর: ______________"));sg.appendChild(el("span","শিক্ষকের স্বাক্ষর: ______________"));box.appendChild(sg);
  box.appendChild(el("h1",d.exam));
  box.appendChild(el("p","নাম: "+d.student+" | তারিখ: "+new Date(d.at).toLocaleString("bn-BD")));
  var it=d.items||[],c=0,w=0,s=0;
  it.forEach(function(x){if(x.chosen==null)s++;else if(x.chosen===x.correct)c++;else w++});
  box.appendChild(el("p","স্কোর: "+bn(d.score)+" / "+bn(d.total)+" | সঠিক: "+bn(c)+" | ভুল: "+bn(w)+" | স্কিপ: "+bn(s)));
  if(!d.recorded){box.appendChild(el("p","এই চেষ্টায় কোনো উত্তর সংরক্ষিত নেই (আগের ফলাফল, অথবা কোনো উত্তর দেওয়া হয়নি)।"));return}
  it.forEach(function(x,i){
    var q=el("div",null,"rq");
    q.appendChild(el("b",bn(i+1)+". "+x.body+" ["+bn(x.marks)+" নম্বর]"));
    var k=x.chosen==null?"sk":(x.chosen===x.correct?"ok":"bad");
    q.appendChild(el("div",k==="sk"?"উত্তর দেওয়া হয়নি (স্কিপ)":(k==="ok"?"সঠিক":"ভুল"),"st st-"+k));
    x.options.forEach(function(o,j){
      var t=o;
      if(j===x.correct)t+="   ✓ সঠিক উত্তর";
      if(j===x.chosen)t+=(j===x.correct?"   (নির্বাচিত)":"   ✗ নির্বাচিত (ভুল)");
      q.appendChild(el("div",t,"ro"+(j===x.correct?" good":(j===x.chosen?" wrong":""))));
    });
    box.appendChild(q);
  });
}

async function loadSummary(){

async function loadHard(){
  var rs=await db.from("results").select("exam_id,answers");
  var qq=await db.from("questions").select("id,exam_id,body");
  var ks=await db.from("answer_keys").select("*");
  var box=$("hard");box.innerHTML="";
  if(rs.error||qq.error||ks.error){box.textContent="লোড করা যায়নি।";return}
  var key={};ks.data.forEach(function(k){key[k.question_id]=k.correct});
  var st={};
  rs.data.forEach(function(r){
    if(!r.answers||!Object.keys(r.answers).length)return;
    qq.data.forEach(function(q){
      if(q.exam_id!==r.exam_id)return;
      var s=st[q.id]||(st[q.id]={q:q,n:0,bad:0});
      s.n++;if(r.answers[q.id]!==key[q.id])s.bad++;
    });
  });
  var list=Object.keys(st).map(function(k){return st[k]}).filter(function(s){return s.bad>0})
    .sort(function(a,b){return b.bad/b.n-a.bad/a.n||b.n-a.n}).slice(0,5);
  if(!list.length){box.textContent="এখনও যথেষ্ট তথ্য নেই (শুধু নতুন জমা পড়া উত্তর গণনা হয়)।";return}
  list.forEach(function(s){
    var row=el("div",null,"hrow");
    row.appendChild(el("span",bn(Math.round(s.bad/s.n*100))+"%","hp"));
    row.appendChild(el("span",s.q.body+" ("+bn(s.bad)+"/"+bn(s.n)+" জন ভুল বা স্কিপ)"));
    box.appendChild(row);
  });
}

async function loadResults(){
  var r=await db.from("results").select("*, exams(title)").order("created_at",{ascending:false});
  var all=r.data||[],sel=$("rex"),keep=sel.value,seen={};
  sel.innerHTML="";var o0=el("option","সব পরীক্ষা");o0.value="";sel.appendChild(o0);
  all.forEach(function(x){if(x.exams&&!seen[x.exam_id]){seen[x.exam_id]=1;var o=el("option",x.exams.title);o.value=x.exam_id;sel.appendChild(o)}});
  sel.value=keep;
  var nq=$("rq").value.trim().toLowerCase(),ex=sel.value;
  r.data=all.filter(function(x){return (!nq||(x.student_name||"").toLowerCase().indexOf(nq)>=0)&&(!ex||String(x.exam_id)===ex)});
  var box=$("results");box.innerHTML="";
  if(!r.data||!r.data.length){box.textContent="এখনও কেউ পরীক্ষা দেয়নি।";return}
  var t=el("table"),h=el("tr");
  ["নাম","পরীক্ষা","স্কোর","তারিখ",""].forEach(function(x){h.appendChild(el("th",x))});
  t.appendChild(h);
  r.data.forEach(function(x){
    var tr=el("tr");
    [x.student_name,x.exams?x.exams.title:"-",bn(x.score)+" / "+bn(x.total),new Date(x.created_at).toLocaleString("bn-BD")]
      .forEach(function(c){tr.appendChild(el("td",c))});
    var td=el("td"),dl=el("button","মুছুন","del");
    dl.onclick=async function(){
      if(!confirm("এই ফলাফল মুছবেন? (স্টুডেন্ট আবার পরীক্ষা দিতে পারবে না, সুযোগ দিতে নিচের তালিকা ব্যবহার করুন)"))return;
      var q=await db.from("results").delete().eq("id",x.id);
      if(q.error)alert(q.error.message);else loadResults();
    };
    var rv=el("button","উত্তরপত্র","ghost");
    rv.onclick=async function(){
      var g=await db.rpc("get_review",{p_result_id:x.id});
      if(g.error||!g.data){alert("উত্তরপত্র লোড হয়নি");return}
      showReview(g.data,$("revbody"));show("rev");window.scrollTo(0,0);
    };
    td.appendChild(rv);td.appendChild(dl);tr.appendChild(td);t.appendChild(tr);
  });
  box.appendChild(t);
}
