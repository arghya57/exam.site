<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অনলাইন পরীক্ষা</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://knjfubfnhwqruqehsqbq.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1c2154">
<style>
@counter-style bnalpha{system:alphabetic;symbols:"ক" "খ" "গ" "ঘ" "ঙ" "চ";suffix:""}
:root{--bg:#eef0f8;--card:#fff;--ink:#181c44;--mute:#5b6088;--line:#d9dcee;--accent:#1c2154;--on:#fff;--gold:#f0a81c;--ok:#1d7a52;--bad:#b83a3a;--serif:"Noto Serif Bengali","Hind Siliguri",serif;--sans:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1230;--card:#181c44;--ink:#eceefb;--mute:#a3a8d1;--line:#2d3270;--accent:#f0a81c;--on:#181c44;--gold:#f0a81c;--ok:#5fd3a0;--bad:#ff8c8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.02rem;line-height:1.7;
  background-image:radial-gradient(circle at 7px 7px,var(--gold) 2.2px,transparent 2.6px),linear-gradient(#1c2154,#1c2154);
  background-size:18px 14px,100% 14px;background-repeat:repeat-x,no-repeat;background-position:0 0,0 0;padding-top:14px}
.wrap{max-width:620px;margin:0 auto;padding:28px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px 22px 6px 22px;padding:24px;margin-bottom:18px}
h1,h2{font-family:var(--serif);color:var(--ink);line-height:1.4}
h1{font-size:1.55rem;margin:0 0 14px;font-weight:700}
h2{font-size:1.15rem;margin:0 0 12px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--gold);display:inline-block}
p{margin:0 0 10px;color:var(--mute)}
label{display:block;font-weight:500;color:var(--mute);font-size:.92rem}
input{width:100%;padding:13px 14px;font:inherit;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:4px 0 14px}
input:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 70%,transparent);outline-offset:2px;border-color:var(--gold)}
button{font:inherit;font-weight:500;border:0;border-radius:12px;padding:12px 20px;background:var(--accent);color:var(--on);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.4}
#auth button{width:100%;margin-bottom:10px}
#submit{width:100%;padding:14px;font-size:1.05rem;background:var(--gold);color:#181c44;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
#opts{counter-reset:o}
.opt{counter-increment:o;display:flex;align-items:center;gap:14px;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt::before{content:counter(o,bnalpha);flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-weight:600}
.opt.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.opt.sel::before{background:var(--gold);color:#181c44}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--on);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-radius:14px;margin-bottom:16px;font-weight:600}
#timer{background:var(--gold);color:#181c44;padding:2px 14px;border-radius:99px;font-variant-numeric:tabular-nums}
.low{background:var(--bad)!important;color:#fff!important}
.err{color:var(--bad);min-height:1.4em}
.hide{display:none}
#qn{color:var(--mute);font-size:.92rem;margin-bottom:4px}
#q{font-size:1.25rem;border:0;display:block;padding:0;margin:0 0 12px}
.score{font-family:var(--serif);font-size:3.6rem;font-weight:700;line-height:1.2;margin:4px 0 10px;display:inline-block;background:linear-gradient(transparent 70%,color-mix(in srgb,var(--gold) 55%,transparent) 70%)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.rv{padding:14px 0;border-top:1px solid var(--line)}
.rv .o{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px}
.rv .ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.rv .no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.rv small{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="loading" class="card"><h2>লোড হচ্ছে...</h2><p>একটু অপেক্ষা করুন।</p></section>

<section id="auth" class="card hide">
  <h1 id="atitle">লগইন করুন</h1>
  <div id="nameBox" class="hide"><label>নাম</label><input id="fname" autocomplete="name"></div>
  <label>ইমেইল</label><input id="email" type="email" autocomplete="email">
  <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="pass" type="password" autocomplete="current-password">
  <div class="err" id="aerr"></div>
  <button id="abtn">লগইন</button>
  <button class="ghost" id="aswitch">নতুন অ্যাকাউন্ট খুলুন</button>
  <button class="ghost" id="forgot">পাসওয়ার্ড ভুলে গেছেন?</button>
</section>

<section id="reset" class="card hide">
  <h1>নতুন পাসওয়ার্ড দিন</h1>
  <input id="npass" type="password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
  <div class="err" id="rerr"></div>
  <button id="rbtn">পাসওয়ার্ড বদলান</button>
</section>

<section id="home" class="hide">
  <div class="card">
    <h1 id="hello"></h1>
    <button class="ghost" id="logout">লগআউট</button>
  </div>
  <div class="card"><h2>পরীক্ষাসমূহ</h2><div id="exams"></div></div>
  <div class="card"><h2>আমার আগের ফলাফল</h2><div id="past"></div></div>
</section>

<section id="exam" class="hide">
  <div class="bar"><span id="etitle"></span><span id="timer"></span></div>
  <div class="card">
    <div id="qn" style="color:var(--mute)"></div>
    <h2 id="q"></h2><p style="font-size:.9rem">সতর্কতা: একবার অপশন বেছে নিলে আর বদলানো যাবে না।</p><div id="opts"></div>
    <div class="nav"><button class="ghost" id="prev">আগের</button><button class="ghost" id="next">পরের</button></div>
  </div>
  <button id="submit">জমা দিন</button>
</section>

<section id="res" class="card hide">
  <h1>আপনার ফলাফল</h1>
  <div class="score" id="score"></div>
  <p id="rmsg"></p>
  <div id="review"></div>
  <button id="back">হোমে ফিরুন</button>
</section>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL="https://knjfubfnhwqruqehsqbq.supabase.co";
var SUPABASE_KEY="sb_publishable_pX5j7jDmv7HIde8FlmLXzA_Obx8kmFu";
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(i){return document.getElementById(i)};
var bn=function(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})};
var user,exam,qs,ans,cur,left,tick,signup=false;

function show(id){$("loading").classList.add("hide");["auth","reset","home","exam","res"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function uname(){return (user.user_metadata&&user.user_metadata.full_name)||user.email}

$("aswitch").onclick=function(){
  signup=!signup;
  $("atitle").textContent=signup?"নতুন অ্যাকাউন্ট":"লগইন করুন";
  $("abtn").textContent=signup?"অ্যাকাউন্ট খুলুন":"লগইন";
  $("aswitch").textContent=signup?"আগে থেকেই অ্যাকাউন্ট আছে":"নতুন অ্যাকাউন্ট খুলুন";
  $("nameBox").classList.toggle("hide",!signup);$("aerr").textContent="";
};
$("abtn").onclick=async function(){
  var email=$("email").value.trim(),pass=$("pass").value;
  $("aerr").textContent="";
  var r;
  if(signup){
    r=await db.auth.signUp({email:email,password:pass,options:{data:{full_name:$("fname").value.trim()}}});
    if(!r.error&&!r.data.session){$("aerr").textContent="ইমেইলে পাঠানো লিংকে চাপ দিয়ে নিশ্চিত করুন, তারপর লগইন করুন।";return}
  }else{
    r=await db.auth.signInWithPassword({email:email,password:pass});
  }
  if(r.error){$("aerr").textContent="ত্রুটি: "+r.error.message}
};
$("logout").onclick=function(){db.auth.signOut()};

var recovering=location.hash.indexOf("type=recovery")>=0;
setTimeout(function(){if(!user&&!$("loading").classList.contains("hide"))show("auth")},4000);
db.auth.onAuthStateChange(function(ev,session){
  user=session?session.user:null;
  if(!user){clearInterval(tick);show("auth");return}
  if(ev==="PASSWORD_RECOVERY")recovering=true;
  if(recovering){show("reset");return}
  if(!$("exam").classList.contains("hide"))return;
  home();
});
$("forgot").onclick=async function(){
  var em=$("email").value.trim();
  if(!em){$("aerr").textContent="আগে ইমেইল ঘরে ইমেইল লিখুন।";return}
  var r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+"/"});
  $("aerr").textContent=r.error?"ত্রুটি: "+r.error.message:"রিসেট লিংক ইমেইলে পাঠানো হয়েছে (স্প্যাম ফোল্ডারও দেখুন)।";
};
$("rbtn").onclick=async function(){
  var p=$("npass").value;
  if(p.length<6){$("rerr").textContent="কমপক্ষে ৬ অক্ষর দিন।";return}
  var r=await db.auth.updateUser({password:p});
  if(r.error){$("rerr").textContent="ত্রুটি: "+r.error.message;return}
  recovering=false;home();
};

async function home(){
  show("home");
  $("hello").textContent="স্বাগতম, "+uname();
  var e=await db.from("exams").select("*").order("id");
  var at=await db.from("attempts").select("exam_id");
  var taken=(at.data||[]).map(function(a){return a.exam_id});
  $("exams").innerHTML=(e.data&&e.data.length)?"":"কোনো পরীক্ষা নেই।";
  (e.data||[]).forEach(function(x){
    var d=document.createElement("div");d.className="row";
    d.innerHTML="<span>"+x.title+" ("+bn(x.duration_minutes)+" মিনিট)</span>";
    var b=document.createElement("button");b.textContent="শুরু করুন";
    if(taken.indexOf(x.id)>=0){b.textContent="পর্যালোচনা দেখুন";b.className="ghost";b.onclick=function(){openOld(x)}}
    else b.onclick=function(){start(x)};
    d.appendChild(b);$("exams").appendChild(d);
  });
  var r=await db.from("results").select("*").order("created_at",{ascending:false});
  $("past").innerHTML=(r.data&&r.data.length)?"":"এখনও কোনো পরীক্ষা দেননি।";
  (r.data||[]).forEach(function(x){
    var d=document.createElement("div");d.className="row";
    d.innerHTML="<span>"+new Date(x.created_at).toLocaleDateString("bn-BD")+"</span><b>"+bn(x.score)+" / "+bn(x.total)+"</b>";
    $("past").appendChild(d);
  });
}

async function start(x){
  var q=await db.from("questions").select("*").eq("exam_id",x.id).order("id");
  if(q.error||!q.data.length){alert("এই পরীক্ষায় কোনো প্রশ্ন নেই।");return}
  if(!confirm("পরীক্ষা শুরু করলে দ্বিতীয়বার দেওয়া যাবে না। পেজ রিফ্রেশ করলেও পরীক্ষা শেষ ধরা হবে। শুরু করবেন?"))return;
  var st=await db.rpc("start_exam",{p_exam_id:x.id});
  if(st.error){alert("শুরু করা যায়নি: "+st.error.message);return}
  exam=x;qs=q.data.sort(function(){return Math.random()-.5});
  qs.forEach(function(z){z.ord=z.options.map(function(_,i){return i}).sort(function(){return Math.random()-.5})});
  ans={};cur=0;left=x.duration_minutes*60;
  $("etitle").textContent=x.title;show("exam");render();
  clearInterval(tick);
  tick=setInterval(function(){left--;clock();if(left<=0)finish()},1000);clock();
}
function clock(){
  var m=Math.floor(left/60),s=left%60;
  $("timer").textContent=bn((m<10?"0":"")+m+":"+(s<10?"0":"")+s);
  $("timer").className=left<=60?"low":"";
}
function render(){
  var q=qs[cur];
  $("qn").textContent="প্রশ্ন "+bn(cur+1)+" / "+bn(qs.length);
  $("q").textContent=q.body+" ["+bn(q.marks||1)+" নম্বর]";
  $("opts").innerHTML="";
  q.ord.forEach(function(i){var o=q.options[i];
    var l=document.createElement("label");
    var locked=ans[q.id]!==undefined;
    l.className="opt"+(ans[q.id]===i?" sel":"");
    if(locked&&ans[q.id]!==i)l.style.opacity=".5";
    l.textContent=o;
    l.onclick=function(){if(ans[q.id]!==undefined)return;ans[q.id]=i;render()};
    $("opts").appendChild(l);
  });
  $("prev").disabled=cur===0;$("next").disabled=cur===qs.length-1;
}
$("prev").onclick=function(){cur--;render()};
$("next").onclick=function(){cur++;render()};
$("submit").onclick=function(){
  var un=qs.length-Object.keys(ans).length;
  if(confirm(un?bn(un)+"টি প্রশ্নের উত্তর বাকি। তবুও জমা দেবেন?":"জমা দেবেন?"))finish();
};
async function finish(){
  clearInterval(tick);
  var r=await db.rpc("submit_exam",{p_exam_id:exam.id,p_name:uname(),p_answers:ans});
  if(r.error){alert("জমা হয়নি: "+r.error.message);return}
  var tm=qs.reduce(function(a,z){return a+(z.marks||1)},0);
  $("score").textContent=bn(r.data)+" / "+bn(tm);
  $("rmsg").textContent=r.data/tm>=.5?"ভালো করেছেন!":"আরও অনুশীলন করুন।";
  $("review").innerHTML="লোড হচ্ছে...";
  show("res");
  await db.rpc("save_answers",{p_exam_id:exam.id,p_answers:ans});
  loadReview(exam);
}

async function loadReview(x){
  var box=$("review");box.innerHTML="";
  var q=await db.from("questions").select("*").eq("exam_id",x.id).order("id");
  var r=await db.rpc("get_review",{p_exam_id:x.id});
  if(q.error||r.error||!r.data){box.textContent="পর্যালোচনা পাওয়া যায়নি।";return}
  var keys=r.data.keys||{},saved=r.data.answers,has=!!saved;
  saved=saved||{};
  var h=document.createElement("h2");h.textContent="উত্তর পর্যালোচনা";box.appendChild(h);
  if(!has){var n0=document.createElement("p");n0.textContent="এই পরীক্ষার আপনার উত্তর সংরক্ষিত নেই, শুধু সঠিক উত্তর দেখানো হচ্ছে।";box.appendChild(n0)}
  q.data.forEach(function(qq,n){
    var c=keys[qq.id],u=saved[qq.id];
    var d=document.createElement("div");d.className="rv";
    var t=document.createElement("div");
    t.textContent=bn(n+1)+". "+qq.body+(has?" "+(u===undefined?"⚪":u===c?"✅":"❌"):"");
    d.appendChild(t);
    qq.options.forEach(function(o,i){
      var el=document.createElement("div");el.className="o"+(i===c?" ok":(has&&i===u?" no":""));
      el.textContent=o+(i===c?"  ✔ সঠিক":"")+(has&&i===u&&i!==c?"  ✘ আপনার উত্তর":"");
      d.appendChild(el);
    });
    if(has&&u===undefined){var sm=document.createElement("small");sm.textContent="উত্তর দেননি";d.appendChild(sm)}
    box.appendChild(d);
  });
}
async function openOld(x){
  var rs=await db.from("results").select("*").eq("exam_id",x.id).order("created_at",{ascending:false}).limit(1);
  var row=rs.data&&rs.data[0];
  $("score").textContent=row?bn(row.score)+" / "+bn(row.total):"";
  $("rmsg").textContent=x.title;
  $("review").innerHTML="লোড হচ্ছে...";
  show("res");
  loadReview(x);
}
$("back").onclick=home;
</script>
</body>
</html>
