<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন প্যানেল</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231c;--mute:#5d6f66;--line:#d5dfd9;--accent:#1f6f50;--bad:#b3362f}
@media (prefers-color-scheme:dark){:root{--bg:#101a15;--card:#18251e;--ink:#e8f1ec;--mute:#9bb0a4;--line:#2b3d33;--accent:#4fb88a;--bad:#ef7b73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 8px} h2{font-size:1.1rem;margin:0 0 10px}
p{margin:0 0 10px;color:var(--mute)}
input,select{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0 8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer;margin-right:6px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;margin:0}
.qb{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.err{color:var(--bad);min-height:1.4em} .ok{color:var(--accent)}
.hide{display:none}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

<section id="login" class="card hide">
  <h1>অ্যাডমিন লগইন</h1>
  <input id="email" type="email" placeholder="ইমেইল">
  <input id="pass" type="password" placeholder="পাসওয়ার্ড">
  <div class="err" id="lerr"></div>
  <button id="lbtn">লগইন</button>
</section>

<section id="denied" class="card hide">
  <h1>অনুমতি নেই</h1>
  <p>এই অ্যাকাউন্ট অ্যাডমিন নয়।</p>
  <button class="ghost" id="lo1">লগআউট</button>
</section>

<section id="panel" class="hide">
  <div class="tabs">
    <button data-t="new">নতুন পরীক্ষা</button>
    <button class="ghost" data-t="list">পরীক্ষা তালিকা</button>
    <button class="ghost" data-t="res">ফলাফল</button>
  </div>

  <div id="t-new" class="card">
    <h2 id="formtitle">নতুন পরীক্ষা যোগ করুন</h2>
    <input id="title" placeholder="পরীক্ষার নাম">
    <input id="dur" type="number" min="1" value="10" placeholder="সময় (মিনিট)">
    <div id="qs"></div>
    <button class="ghost" id="addq">+ প্রশ্ন যোগ</button>
    <button id="save">পরীক্ষা সংরক্ষণ করুন</button>
    <button class="ghost" onclick="location.reload()">বাতিল / নতুন ফর্ম</button>
    <div id="msg" class="err"></div>
  </div>

  <div id="t-list" class="card hide"><h2>সব পরীক্ষা</h2><div id="exams"></div></div>
  <div id="t-res" class="card hide"><h2>স্টুডেন্টদের ফলাফল</h2><div class="tw" id="results"></div>
    <h2 style="margin-top:20px">কে কোন পরীক্ষা শুরু করেছে</h2>
    <p>যার নেট বা ফোনের সমস্যা হয়েছে, তাকে এখান থেকে আবার সুযোগ দিন। আগের ফলাফল (থাকলে) মুছে যাবে।</p>
    <div class="tw" id="tries"></div></div>

  <button class="ghost" id="lo2">লগআউট</button>
</section>

</div>
<script>
var db=supabase.createClient("https://knjfubfnhwqruqehsqbq.supabase.co","sb_publishable_pX5j7jDmv7HIde8FlmLXzA_Obx8kmFu");
var $=function(i){return document.getElementById(i)};
var bn=function(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})};
function show(id){["login","denied","panel"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}

$("lbtn").onclick=async function(){
  $("lerr").textContent="";
  var r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});
  if(r.error)$("lerr").textContent="ত্রুটি: "+r.error.message;
};
$("lo1").onclick=$("lo2").onclick=function(){db.auth.signOut()};

db.auth.onAuthStateChange(async function(_e,s){
  if(!s){show("login");return}
  var a=await db.from("admins").select("user_id").maybeSingle();
  if(!a.data){show("denied");return}
  show("panel");if(!$("qs").children.length)addQ();
});

document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".tabs button").forEach(function(x){x.className="ghost"});
    b.className="";
    ["new","list","res"].forEach(function(t){$("t-"+t).classList.toggle("hide",t!==b.dataset.t)});
    if(b.dataset.t==="list")loadExams();
    if(b.dataset.t==="res"){loadResults();loadTries()}
  };
});

function addQ(pre){
  var n=$("qs").children.length+1;
  var d=el("div",null,"qb");
  d.appendChild(el("b","প্রশ্ন "+bn(n)));
  var q=el("input");q.placeholder="প্রশ্ন লিখুন";q.className="qbody";d.appendChild(q);
  ["ক","খ","গ","ঘ"].forEach(function(l){var o=el("input");o.placeholder="অপশন "+l;o.className="opt";d.appendChild(o)});
  var s=el("select");s.className="corr";
  ["ক","খ","গ","ঘ"].forEach(function(l,i){var o=el("option","সঠিক উত্তর: "+l);o.value=i;s.appendChild(o)});
  d.appendChild(s);
  var mk=el("input");mk.type="number";mk.min=1;mk.value=pre?pre.marks:1;mk.className="marks";
  d.appendChild(el("span","এই প্রশ্নের নম্বর:"));d.appendChild(mk);
  if(pre){q.value=pre.body;d.querySelectorAll(".opt").forEach(function(o,i){o.value=pre.options[i]});s.value=pre.correct}
  $("qs").appendChild(d);
}
var editId=null;
$("addq").onclick=function(){addQ()};

$("save").onclick=async function(){
  var m=$("msg");m.className="err";m.textContent="";
  var title=$("title").value.trim(),dur=parseInt($("dur").value);
  if(!title||!dur){m.textContent="নাম ও সময় দিন।";return}
  var items=[];
  var blocks=$("qs").children;
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i],body=b.querySelector(".qbody").value.trim();
    var opts=[].map.call(b.querySelectorAll(".opt"),function(x){return x.value.trim()});
    if(!body&&opts.every(function(o){return !o}))continue;
    if(!body||opts.some(function(o){return !o})){m.textContent="প্রশ্ন "+bn(i+1)+": প্রশ্ন ও চারটি অপশনই লিখুন।";return}
    items.push({body:body,options:opts,correct:parseInt(b.querySelector(".corr").value),marks:Math.max(1,parseInt(b.querySelector(".marks").value)||1)});
  }
  if(!items.length){m.textContent="অন্তত একটি প্রশ্ন দিন।";return}
  var e;
  if(editId){
    e=await db.from("exams").update({title:title,duration_minutes:dur}).eq("id",editId).select().single();
    if(!e.error){var dq=await db.from("questions").delete().eq("exam_id",editId);if(dq.error){m.textContent="ত্রুটি: "+dq.error.message;return}}
  }else e=await db.from("exams").insert({title:title,duration_minutes:dur}).select().single();
  if(e.error){m.textContent="ত্রুটি: "+e.error.message;return}
  var q=await db.from("questions").insert(items.map(function(x){return {exam_id:e.data.id,body:x.body,options:x.options,marks:x.marks}})).select();
  if(q.error){m.textContent="ত্রুটি: "+q.error.message;return}
  var keys=q.data.map(function(row,i){return {question_id:row.id,correct:items[i].correct}});
  var k=await db.from("answer_keys").insert(keys);
  if(k.error){m.textContent="ত্রুটি: "+k.error.message;return}
  m.className="ok";m.textContent="সংরক্ষণ হয়েছে ("+bn(items.length)+"টি প্রশ্ন)।";
  editId=null;$("formtitle").textContent="নতুন পরীক্ষা যোগ করুন";
  $("title").value="";$("dur").value=10;$("qs").innerHTML="";addQ();
};

async function editExam(x){
  var q=await db.from("questions").select("*").eq("exam_id",x.id).order("id");
  if(q.error){alert("লোড করা যায়নি: "+q.error.message);return}
  var k=await db.from("answer_keys").select("*").in("question_id",q.data.map(function(r){return r.id}));
  if(k.error){alert("লোড করা যায়নি: "+k.error.message);return}
  var key={};k.data.forEach(function(r){key[r.question_id]=r.correct});
  editId=x.id;
  $("title").value=x.title;$("dur").value=x.duration_minutes;$("qs").innerHTML="";
  q.data.forEach(function(r){addQ({body:r.body,options:r.options,correct:key[r.id],marks:r.marks})});
  $("formtitle").textContent="এডিট: "+x.title;$("msg").textContent="";
  document.querySelector('.tabs button[data-t="new"]').click();
}

async function loadExams(){
  var r=await db.from("exams").select("*").order("id",{ascending:false});
  var box=$("exams");box.innerHTML="";
  if(!r.data||!r.data.length){box.textContent="কোনো পরীক্ষা নেই।";return}
  r.data.forEach(function(x){
    var row=el("div",null,"row");
    row.appendChild(el("span",x.title+" ("+bn(x.duration_minutes)+" মিনিট)"));
    var ed=el("button","এডিট");ed.onclick=function(){editExam(x)};
    var d=el("button","মুছুন","del");
    d.onclick=async function(){
      if(!confirm("\""+x.title+"\" মুছে ফেলবেন? এর প্রশ্ন ও ফলাফলও মুছে যাবে।"))return;
      await db.from("results").delete().eq("exam_id",x.id);
      var e=await db.from("exams").delete().eq("id",x.id);
      if(e.error)alert(e.error.message);else loadExams();
    };
    var bs=el("span");bs.appendChild(ed);bs.appendChild(d);row.appendChild(bs);box.appendChild(row);
  });
}

async function loadTries(){
  var r=await db.rpc("admin_attempts");
  var box=$("tries");box.innerHTML="";
  if(r.error){box.textContent="ত্রুটি: "+r.error.message;return}
  if(!r.data.length){box.textContent="কেউ এখনও পরীক্ষা শুরু করেনি।";return}
  var t=el("table"),h=el("tr");
  ["ইমেইল","পরীক্ষা","অবস্থা",""].forEach(function(x){h.appendChild(el("th",x))});
  t.appendChild(h);
  r.data.forEach(function(x){
    var tr=el("tr");
    [x.email,x.exam_title,x.submitted?"জমা দিয়েছে":"শুরু করেছে, জমা হয়নি"].forEach(function(c){tr.appendChild(el("td",c))});
    var td=el("td"),b=el("button","আবার সুযোগ দিন","ghost");
    b.onclick=async function(){
      if(!confirm(x.email+" কে \""+x.exam_title+"\" আবার দেওয়ার সুযোগ দেবেন? আগের ফলাফল মুছে যাবে।"))return;
      var q=await db.rpc("admin_reset",{p_user:x.user_id,p_exam:x.exam_id});
      if(q.error)alert(q.error.message);else{loadResults();loadTries()}
    };
    td.appendChild(b);tr.appendChild(td);t.appendChild(tr);
  });
  box.appendChild(t);
}

async function loadResults(){
  var r=await db.from("results").select("*, exams(title)").order("created_at",{ascending:false});
  var box=$("results");box.innerHTML="";
  if(!r.data||!r.data.length){box.textContent="এখনও কেউ পরীক্ষা দেয়নি।";return}
  var t=el("table"),h=el("tr");
  ["নাম","পরীক্ষা","স্কোর","তারিখ",""].forEach(function(x){h.appendChild(el("th",x))});
  t.appendChild(h);
  r.data.forEach(function(x){
    var tr=el("tr");
    [x.student_name,x.exams?x.exams.title:"-",bn(x.score)+" / "+bn(x.total),new Date(x.created_at).toLocaleString("bn-BD")]
      .forEach(function(c){tr.appendChild(el("td",c))});
    var td=el("td"),dl=el("button","মুছুন","del");
    dl.onclick=async function(){
      if(!confirm("এই ফলাফল মুছবেন? (স্টুডেন্ট আবার পরীক্ষা দিতে পারবে না, সুযোগ দিতে নিচের তালিকা ব্যবহার করুন)"))return;
      var q=await db.from("results").delete().eq("id",x.id);
      if(q.error)alert(q.error.message);else loadResults();
    };
    td.appendChild(dl);tr.appendChild(td);t.appendChild(tr);
  });
  box.appendChild(t);
}
</script>
</body>
</html>
